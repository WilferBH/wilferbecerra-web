<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada · Wilfer Becerra</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15171b;
        --fg: #eceff3;
        --fg-2: #a3adba;
        --accent: #1fbf9f;
        --line: rgb(255 255 255 / 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(1200px 700px at 85% -10%, rgb(31 191 159 / 0.07), transparent 60%), var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 46rem;
      }
      p.code {
        margin: 0 0 1.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 500;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      h1 em {
        font-family: ui-serif, Georgia, serif;
        color: var(--accent);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2.5rem;
      }
      a {
        display: inline-block;
        padding: 0.8rem 1.4rem;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        transition: border-color 0.2s, background-color 0.2s;
      }
      a.primary {
        background: var(--fg);
        color: var(--bg);
      }
      a.primary:hover {
        background: var(--accent);
      }
      a.ghost {
        border: 1px solid var(--line);
        color: var(--fg);
      }
      a.ghost:hover {
        border-color: var(--fg-2);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>Esta página no existe. <em>This page doesn't exist.</em></h1>
      <div class="links">
        <a class="primary" href="/es">Volver al inicio</a>
        <a class="ghost" href="/en">Back to home</a>
      </div>
    </main>
  </body>
</html>
